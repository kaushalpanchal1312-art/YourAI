<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourAI</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --user-bg: #4f46e5;
      --user-text: #ffffff;
      --border: #e3e3e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --panel: #1f1f22;
        --text: #ececec;
        --muted: #9a9aa0;
        --accent: #818cf8;
        --accent-soft: #2a2a40;
        --user-bg: #6366f1;
        --user-text: #ffffff;
        --border: #2e2e33;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 20px; margin: 0; color: var(--accent); }
    button {
      font: inherit;
      cursor: pointer;
    }
    #newChat {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
    }
    #newChat:hover { border-color: var(--accent); color: var(--accent); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    .welcome {
      text-align: center;
      margin-top: 40px;
    }
    .welcome h2 { margin-bottom: 6px; }
    .welcome p { color: var(--muted); margin-top: 0; }
    .starters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .starter {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
    }
    .starter:hover { border-color: var(--accent); }

    .message {
      display: flex;
      margin-bottom: 14px;
    }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    .message.user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border: none;
    }
    .message.error .bubble {
      border-color: #d9534f;
      color: #d9534f;
    }
    .typing { color: var(--muted); font-style: italic; }

    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }
    form {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      font: inherit;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      max-height: 160px;
    }
    textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>YourAI</h1>
    <button id="newChat" type="button">New chat</button>
  </header>

  <main>
    <div class="container" id="chat">
      <div class="welcome" id="welcome">
        <h2>Hi, how can I help?</h2>
        <p>Ask anything: daily problems, school projects, writing, or ideas.</p>
        <div class="starters">
          <button class="starter" data-prompt="Explain this concept in simple terms: ">Explain a concept</button>
          <button class="starter" data-prompt="Help me with this homework problem. Show the steps: ">Help with homework</button>
          <button class="starter" data-prompt="Help me plan my day. Here are my tasks and time: ">Plan my day</button>
          <button class="starter" data-prompt="Check my writing and suggest improvements: ">Check my writing</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type your question..." aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("newChat");

    let history = [];
    let busy = false;

    function addMessage(role, text, extraClass = "") {
      const row = document.createElement("div");
      row.className = `message ${role} ${extraClass}`.trim();
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text; // textContent keeps user/AI text safe from HTML injection
      row.appendChild(bubble);
      chat.appendChild(row);
      scrollToBottom();
      return row;
    }

    function scrollToBottom() {
      const main = document.querySelector("main");
      main.scrollTop = main.scrollHeight;
    }

    function hideWelcome() {
      if (welcome) welcome.style.display = "none";
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;
      busy = true;
      sendBtn.disabled = true;
      hideWelcome();

      history.push({ role: "user", content: text });
      addMessage("user", text);
      const typing = addMessage("assistant", "Thinking...", "typing-row");
      typing.querySelector(".bubble").classList.add("typing");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        typing.remove();

        if (!res.ok) {
          // Remove the unanswered question so the next try starts clean.
          history.pop();
          addMessage("assistant", data.error || "Something went wrong.", "error");
        } else {
          history.push({ role: "assistant", content: data.reply });
          addMessage("assistant", data.reply);
        }
      } catch (err) {
        typing.remove();
        history.pop();
        addMessage("assistant", "Network error. Check your connection and try again.", "error");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      autoGrow();
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    function autoGrow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }
    input.addEventListener("input", autoGrow);

    document.querySelectorAll(".starter").forEach((btn) => {
      btn.addEventListener("click", () => {
        input.value = btn.dataset.prompt;
        autoGrow();
        input.focus();
      });
    });

    newChatBtn.addEventListener("click", () => {
      if (busy) return;
      history = [];
      chat.innerHTML = "";
      chat.appendChild(welcome);
      welcome.style.display = "";
      input.value = "";
      autoGrow();
      input.focus();
    });
  </script>
</body>
</html>
